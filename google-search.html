<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BerukSakti</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #191a1a;
    --sidebar: #202222;
    --panel: #202222;
    --panel-2: #2a2c2c;
    --text: #e8e8e6;
    --muted: #8d9191;
    --border: #353838;
    --accent: #20b8cd;
    --accent-dark: #1a9aab;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
  }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; }

  /* Sidebar */
  aside {
    width: 72px;
    flex: none;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px 0;
    gap: 6px;
  }
  .brand {
    width: 36px; height: 36px; border-radius: 10px;
    display: grid; place-items: center;
    color: var(--accent); margin-bottom: 10px;
  }
  .new-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--panel-2); border: 1px solid var(--border);
    display: grid; place-items: center; cursor: pointer; margin-bottom: 12px;
  }
  .new-btn:hover { border-color: var(--muted); }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 11px; color: var(--muted); padding: 8px 4px; width: 60px;
    border-radius: 8px; cursor: pointer;
  }
  .nav-item:hover, .nav-item.current { color: var(--text); background: rgba(255,255,255,.05); }
  .spacer { flex: 1; }
  .avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: #3b4b4d; color: var(--text);
    display: grid; place-items: center; font-size: 13px; font-weight: 600;
  }

  /* Main */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 16px;
    min-width: 0;
  }
  .center {
    width: 100%; max-width: 680px;
    margin-top: 22vh;
  }
  .logo {
    text-align: center;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(32px, 7vw, 46px);
    font-weight: 400;
    letter-spacing: -.5px;
    margin: 0 0 28px;
    user-select: none;
  }
  .logo b { color: var(--accent); font-weight: 400; }

  /* Ask box */
  form { position: relative; }
  .ask {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 14px 10px;
    transition: border-color .15s;
  }
  .ask:focus-within { border-color: #4a4e4e; }
  .ask textarea {
    width: 100%;
    border: 0; outline: 0; resize: none;
    background: transparent; color: var(--text);
    font: inherit; font-size: 16px; line-height: 1.5;
    min-height: 48px; max-height: 200px;
    padding: 2px 4px;
  }
  .ask textarea::placeholder { color: var(--muted); }
  .toolbar {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 6px; gap: 8px;
  }
  .modes {
    display: flex; background: var(--bg); border-radius: 10px; padding: 3px;
    border: 1px solid var(--border);
  }
  .modes button {
    background: none; border: 0; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 7px; font-size: 13px; color: var(--muted);
  }
  .modes button.on { background: var(--panel-2); color: var(--accent); }
  .tools { display: flex; align-items: center; gap: 4px; }
  .icon-btn {
    background: none; border: 0; cursor: pointer;
    width: 34px; height: 34px; border-radius: 8px;
    display: grid; place-items: center; color: var(--muted);
  }
  .icon-btn:hover { color: var(--text); background: rgba(255,255,255,.06); }
  .send {
    width: 34px; height: 34px; border-radius: 8px; border: 0; cursor: pointer;
    background: var(--panel-2); color: var(--muted);
    display: grid; place-items: center; margin-left: 4px;
  }
  .has-text .send { background: var(--accent); color: #0d1414; }
  .has-text .send:hover { background: var(--accent-dark); }

  /* Suggestions dropdown */
  .suggestions {
    display: none;
    position: absolute; top: calc(100% + 6px); left: 0; right: 0;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    list-style: none; margin: 0; padding: 6px;
    z-index: 10;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  form.open .suggestions { display: block; }
  .suggestions li {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 15px;
  }
  .suggestions li:hover, .suggestions li.active { background: rgba(255,255,255,.06); }
  .suggestions li svg { flex: none; color: var(--muted); }

  /* Quick chips */
  .chips {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
    margin-top: 18px;
  }
  .chip {
    background: none; border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 14px; font-size: 13px; color: var(--muted); cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  .chip:hover { color: var(--text); border-color: #4a4e4e; }

  footer {
    margin-top: auto; padding: 18px 0;
    display: flex; flex-wrap: wrap; justify-content: center; gap: 18px;
    font-size: 13px; color: var(--muted);
  }
  footer a:hover { color: var(--text); }

  @media (max-width: 600px) {
    body { flex-direction: column-reverse; }
    aside {
      width: 100%; flex-direction: row; justify-content: space-around;
      border-right: 0; border-top: 1px solid var(--border); padding: 6px 8px;
    }
    .brand, .spacer, .new-btn { display: none; }
    .center { margin-top: 12vh; }
    .modes button span { display: none; }
  }
</style>
</head>
<body>
<aside>
  <div class="brand" aria-label="BerukSakti">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 2v20M4 6l8 5 8-5M4 6v12l8-5 8 5V6M4 18l8-5"/></svg>
  </div>
  <button class="new-btn" id="newThread" title="Utas baru">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <a class="nav-item current" href="#">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    Beranda
  </a>
  <a class="nav-item" href="https://news.google.com/?hl=id">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>
    Jelajah
  </a>
  <a class="nav-item" href="#" id="libraryLink">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h4v14H4zM10 5h4v14h-4zM16 6l3.5-1 2 13.5-3.5 1z"/></svg>
    Pustaka
  </a>
  <div class="spacer"></div>
  <div class="avatar" title="Akun">BS</div>
</aside>

<main>
  <div class="center">
    <h1 class="logo">beruk<b>sakti</b></h1>

    <form id="searchForm" autocomplete="off">
      <div class="ask" id="box">
        <textarea id="q" name="q" rows="2" placeholder="Tanya apa saja…" aria-label="Tanya apa saja" autofocus></textarea>
        <div class="toolbar">
          <div class="modes" role="tablist">
            <button type="button" class="on" data-mode="search" title="Cari di web">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <span>Cari</span>
            </button>
            <button type="button" data-mode="ai" title="Tanya AI">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.9 5.6L19.5 9.5l-5.6 1.9L12 17l-1.9-5.6L4.5 9.5l5.6-1.9zM19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z"/></svg>
              <span>Tanya AI</span>
            </button>
          </div>
          <div class="tools">
            <button type="button" class="icon-btn" id="mic" aria-label="Penelusuran suara" title="Suara">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
            </button>
            <button type="submit" class="send" aria-label="Kirim" title="Kirim">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </div>
        </div>
      </div>
      <ul class="suggestions" id="suggestions" role="listbox"></ul>
    </form>

    <div class="chips" id="chips">
      <button type="button" class="chip">☁️ Cuaca hari ini</button>
      <button type="button" class="chip">📈 Harga emas hari ini</button>
      <button type="button" class="chip">💱 Kurs dollar ke rupiah</button>
      <button type="button" class="chip">🍳 Resep nasi goreng</button>
    </div>
  </div>

  <footer>
    <a href="#">Tentang</a>
    <a href="#">Privasi</a>
    <a href="#">Persyaratan</a>
    <a href="#">Bahasa Indonesia</a>
  </footer>
</main>

<script>
  const form = document.getElementById('searchForm');
  const box = document.getElementById('box');
  const q = document.getElementById('q');
  const list = document.getElementById('suggestions');
  const modeBtns = document.querySelectorAll('.modes button');

  const SAMPLE = [
    'cuaca hari ini', 'berita terkini', 'kurs dollar ke rupiah', 'resep nasi goreng',
    'jadwal sholat', 'terjemahan inggris indonesia', 'harga emas hari ini',
    'cara membuat website', 'tutorial javascript', 'google maps', 'youtube',
    'kalkulator', 'jam berapa sekarang', 'film bioskop terbaru', 'claude ai'
  ];
  let history = [];
  try { history = JSON.parse(localStorage.getItem('searchHistory') || '[]'); } catch (e) {}

  let mode = 'search';
  try { mode = localStorage.getItem('askMode') || 'search'; } catch (e) {}
  let active = -1;

  function setMode(m) {
    mode = m;
    modeBtns.forEach(b => b.classList.toggle('on', b.dataset.mode === m));
    q.placeholder = m === 'ai' ? 'Tanya AI apa saja…' : 'Tanya apa saja…';
    try { localStorage.setItem('askMode', m); } catch (e) {}
  }
  modeBtns.forEach(b => b.addEventListener('click', () => { setMode(b.dataset.mode); q.focus(); }));
  setMode(mode);

  function go(term) {
    term = term.trim();
    if (!term) return;
    history = [term, ...history.filter(h => h !== term)].slice(0, 8);
    try { localStorage.setItem('searchHistory', JSON.stringify(history)); } catch (e) {}
    // Mode "Tanya AI" membuka Claude, mode "Cari" membuka Google
    window.location.href = mode === 'ai'
      ? 'https://claude.ai/new?q=' + encodeURIComponent(term)
      : 'https://www.google.com/search?q=' + encodeURIComponent(term);
  }

  function autosize() {
    q.style.height = 'auto';
    q.style.height = q.scrollHeight + 'px';
  }

  function render() {
    const v = q.value.trim().toLowerCase();
    box.classList.toggle('has-text', v.length > 0);
    const fromHistory = history.filter(h => h.toLowerCase().includes(v)).map(t => ({ t, h: true }));
    const fromSample = v ? SAMPLE.filter(s => s.includes(v) && !history.includes(s)).map(t => ({ t, h: false })) : [];
    const items = [...fromHistory, ...fromSample].slice(0, 8);
    active = -1;
    list.innerHTML = '';
    items.forEach(({ t, h }) => {
      const li = document.createElement('li');
      li.innerHTML = h
        ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'
        : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>';
      const span = document.createElement('span');
      span.textContent = t;
      li.appendChild(span);
      li.addEventListener('mousedown', e => { e.preventDefault(); go(t); });
      list.appendChild(li);
    });
    form.classList.toggle('open', items.length > 0 && document.activeElement === q);
  }

  q.addEventListener('input', () => { autosize(); render(); });
  q.addEventListener('focus', render);
  q.addEventListener('blur', () => form.classList.remove('open'));
  q.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      go(q.value);
      return;
    }
    const items = [...list.children];
    if (!items.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      active = (active + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items.forEach((li, i) => li.classList.toggle('active', i === active));
      q.value = items[active].textContent;
    } else if (e.key === 'Escape') {
      form.classList.remove('open');
    }
  });

  form.addEventListener('submit', e => { e.preventDefault(); go(q.value); });

  document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
    go(c.textContent.replace(/^\S+\s/, ''));
  }));

  document.getElementById('newThread').addEventListener('click', () => {
    q.value = ''; autosize(); render(); q.focus();
  });

  document.getElementById('libraryLink').addEventListener('click', e => {
    e.preventDefault();
    q.value = ''; q.focus(); render();
  });

  document.getElementById('mic').addEventListener('click', () => {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { alert('Browser ini tidak mendukung penelusuran suara.'); return; }
    const rec = new SR();
    rec.lang = 'id-ID';
    rec.onresult = ev => { q.value = ev.results[0][0].transcript; go(q.value); };
    rec.start();
  });

  // Shortcut "/" untuk fokus ke kotak pencarian
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  });
</script>
</body>
</html>
