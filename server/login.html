<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masuk · Beruk Sakti</title>
<style>
:root { color-scheme: dark; --bg: #070b12; --panel: #111924; --fg: #e4eaf0; --muted: #8d9cac; --line: #233040; --accent: #5b9de0; --bad: #f06a6a; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: radial-gradient(60rem 40rem at 85% -10%, rgba(99,102,241,.16), transparent 60%), radial-gradient(50rem 36rem at -5% 110%, rgba(34,211,238,.12), transparent 60%), var(--bg); color: var(--fg); font: 14px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; }
.card { width: min(100%, 380px); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 28px 24px; box-shadow: 0 8px 24px rgba(0,0,0,.5); }
.brand { display: flex; align-items: center; gap: 10px; color: var(--accent); margin-bottom: 18px; }
.brand b { display: block; color: var(--fg); font: 20px/1.2 Georgia, "Times New Roman", serif; font-weight: 400; }
.brand small { color: var(--muted); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; }
label { display: block; margin: 14px 0 6px; color: var(--muted); font-size: 12px; }
input { width: 100%; padding: 10px 12px; font: inherit; color: var(--fg); background: #0b111a; border: 1px solid var(--line); border-radius: 8px; }
input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button { width: 100%; margin-top: 20px; padding: 10px 12px; font: inherit; font-weight: 600; color: #04121f; background: var(--accent); border: 0; border-radius: 8px; cursor: pointer; }
button:disabled { opacity: .6; cursor: default; }
.err { min-height: 1.4em; margin: 14px 0 0; color: var(--bad); font-size: 13px; }
.note { margin: 18px 0 0; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main class="card">
  <div class="brand">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/></svg>
    <span><b>Beruk Sakti</b><small>Monitoring</small></span>
  </div>
  <form id="f" autocomplete="on">
    <label for="u">Nama pengguna</label>
    <input id="u" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="p">Kata sandi</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <p class="err" id="err" role="alert"></p>
    <button id="go" type="submit">Masuk</button>
  </form>
  <p class="note">Belum punya akun? Minta administrator menambahkannya di server.</p>
</main>
<script>
const f = document.getElementById('f');
const err = document.getElementById('err');
const go = document.getElementById('go');
f.addEventListener('submit', async (ev) => {
  ev.preventDefault();
  err.textContent = '';
  go.disabled = true;
  try {
    const res = await fetch('api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: f.username.value, password: f.password.value}),
    });
    const data = await res.json().catch(() => ({}));
    if (res.ok) { location.reload(); return; }
    err.textContent = data.error || 'Gagal masuk (kode ' + res.status + ').';
    f.password.value = '';
    f.password.focus();
  } catch (e) {
    err.textContent = 'Tidak bisa menghubungi server.';
  }
  go.disabled = false;
});
</script>
</body>
</html>
